version: 2
updates:
  # The Next.js app lives in web/. The static demo at the repo root has no dependencies.
  # Major version jumps (for example TypeScript or ESLint) are not opened automatically:
  # they can break the build and should be a deliberate upgrade.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
