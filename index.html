<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light}body{margin:0}[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>דיווח הגנים</title><title>דיווח הגנים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{
    --bg:#F5F5F7;
    --surface:#FFFFFF;
    --surface-2:#F2F2F5;
    --ink:#1D1D1F;
    --ink-muted:#6E6E73;
    --line:#E5E5EA;
    --line-strong:#D2D2D7;
    --accent:#253A8C;
    --accent-strong:#1C2D6E;
    --accent-soft:#E9EDF8;
    --warm:#B8520F;
    --warm-ink:#A44A0E;
    --on-fill:#fff;
    --field-border:#86868B;
    --warm-soft:#FDEEE3;
    --success:#0F7038;
    --success-soft:#E5F4EB;
    --warning:#8A5A00;
    --warning-soft:#FBF3DC;
    --critical:#C2362B;
    --critical-soft:#FCEAE8;
    --info:#4A5DA3;
    --info-soft:#EDF0FA;
    --focus-ring:#253A8C;
    --brand-orange:#F07221;
    --brand-yellow:#E4BA36;
    --brand-red:#DE4E42;
    --brand-green:#128442;
    --brand-periwinkle:#6679B9;
    --glass:rgba(255,255,255,.78);
    --radius-lg:14px;
    --radius:12px;
    --radius-sm:9px;
    --shadow-1:0 0 0 .5px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.05);
    --shadow-2:0 0 0 .5px rgba(0,0,0,.08),0 18px 48px -16px rgba(0,0,0,.28);
    --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Hebrew","Heebo","Segoe UI",Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo","Segoe UI",Arial,sans-serif;
    --font-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo","Segoe UI",Arial,sans-serif;
    --scale:1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#000000;
      --surface:#1C1C1E;
      --surface-2:#2C2C2E;
      --ink:#F5F5F7;
      --ink-muted:#A1A1A6;
      --line:#38383A;
      --line-strong:#48484A;
      --accent:#8EA2F5;
      --accent-strong:#AEBDF8;
      --accent-soft:#1F2747;
      --warm:#F59A5B;
      --warm-ink:#F59A5B;
      --on-fill:#0B1440;
      --field-border:#8E8E93;
      --warm-soft:#3A2516;
      --success:#3DBF73;
      --success-soft:#14301F;
      --warning:#F2C14E;
      --warning-soft:#3A2F12;
      --critical:#FF7A6E;
      --critical-soft:#3D1C19;
      --info:#9AA9E6;
      --info-soft:#1D2440;
      --focus-ring:#AEBDF8;
      --glass:rgba(28,28,30,.72);
      --shadow-1:0 0 0 .5px rgba(255,255,255,.06);
      --shadow-2:0 0 0 .5px rgba(255,255,255,.1),0 18px 48px -16px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark; --warm-ink:#F59A5B; --on-fill:#0B1440; --field-border:#8E8E93;
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --ink:#F5F5F7; --ink-muted:#A1A1A6;
    --line:#38383A; --line-strong:#48484A; --accent:#8EA2F5; --accent-strong:#AEBDF8; --accent-soft:#1F2747;
    --warm:#F59A5B; --warm-soft:#3A2516; --success:#3DBF73; --success-soft:#14301F; --warning:#F2C14E;
    --warning-soft:#3A2F12; --critical:#FF7A6E; --critical-soft:#3D1C19; --info:#9AA9E6; --info-soft:#1D2440;
    --focus-ring:#AEBDF8; --glass:rgba(28,28,30,.72); --shadow-1:0 0 0 .5px rgba(255,255,255,.06); --shadow-2:0 0 0 .5px rgba(255,255,255,.1),0 18px 48px -16px rgba(0,0,0,.8);
  }
  :root[data-contrast="high"]:not(#_), [data-contrast="high"]{
    color-scheme:light; --on-fill:#fff; --field-border:#000000; --warm:#7A3E0E; --warm-ink:#7A3E0E; --warm-soft:#F6E2CF;
    --shadow-1:0 0 0 1px #000; --shadow-2:0 0 0 2px #000; --glass:#FFFFFF;
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F1F1; --ink:#000000; --ink-muted:#1A1A1A;
    --line:#000000; --line-strong:#000000; --accent:#1C2D6E; --accent-strong:#111C47; --accent-soft:#DDE3F5;
    --success:#0B5D24; --success-soft:#DCF3E2; --warning:#6B4A00; --warning-soft:#F7E7BE;
    --critical:#7A160A; --critical-soft:#F8D8D3; --info:#0C3E7A; --info-soft:#D9E6F7; --focus-ring:#000000;
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--accent-soft);color:var(--ink);}
  html{font-size:calc(16px * var(--scale));scroll-padding-top:5.5rem;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:1rem;
    direction:rtl;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;margin:0 0 .3em;text-wrap:balance;color:var(--ink);}
  p{margin:0 0 .8em;color:var(--ink-muted);}
  a{color:var(--accent-strong);}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;}
  button,input,select,textarea{font:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }

  .skip-link{
    position:absolute;right:1rem;top:-60px;background:var(--accent-strong);color:var(--on-fill);padding:.7em 1.2em;
    border-radius:0 0 var(--radius-sm) var(--radius-sm);z-index:200;transition:top .15s ease;font-weight:600;
  }
  .skip-link:focus{top:0;}

  .app-shell{min-height:100vh;display:flex;flex-direction:column;color:var(--ink);background:var(--bg);}

  header.topbar{
    display:flex;align-items:center;gap:.9rem;padding:.7rem 1.2rem;background:var(--surface);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;box-shadow:var(--shadow-1);
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:700;font-size:1.15rem;}
  .brand-mark{
    width:2.1rem;height:2.1rem;border-radius:8px;background:var(--accent);color:var(--on-fill);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;flex:none;
  }
  .brand-logo{display:block;height:2.4rem;width:auto;background:#fff;border-radius:8px;padding:.3rem .55rem;flex:none;box-shadow:0 0 0 1px var(--line);}
  .welcome-logo{display:block;height:4.2rem;width:auto;margin:0 auto 1.1rem;background:#fff;border-radius:12px;padding:.55rem 1rem;box-shadow:0 0 0 1px var(--line);}
  .kosher-shell .brand-logo{height:3.2rem;margin:0 auto 1rem;}
  .brand small{display:block;font-family:var(--font-body);font-weight:600;font-size:.66rem;letter-spacing:.06em;
    color:var(--ink-muted);text-transform:uppercase;}
  .topbar-spacer{flex:1;}

  .role-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
  .role-switch button{
    border:none;background:transparent;padding:.5rem 1rem;border-radius:999px;font-weight:600;font-size:.85rem;
    color:var(--ink-muted);display:flex;align-items:center;gap:.4rem;
  }
  .role-switch button[aria-pressed="true"]{background:var(--accent);color:var(--on-fill);}

  .icon-btn{
    display:inline-flex;align-items:center;gap:.4rem;background:var(--surface-2);border:1px solid var(--line);
    padding:.5rem .8rem;border-radius:999px;font-weight:600;font-size:.82rem;color:var(--ink);
  }
  .icon-btn:hover{border-color:var(--line-strong);}
  svg.ico{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}

  .layout{display:flex;flex:1;min-height:0;}
  nav.rail{
    width:15.5rem;flex:none;background:var(--surface);border-inline-end:1px solid var(--line);
    padding:1.1rem .8rem;display:flex;flex-direction:column;gap:.25rem;
    position:sticky;top:4.3rem;align-self:flex-start;max-height:calc(100vh - 4.3rem);overflow-y:auto;
  }
  nav.rail:empty{display:none;}
  nav.rail .rail-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);
    font-weight:700;padding:.4rem .7rem .3rem;}
  nav.rail button{
    display:flex;align-items:center;gap:.65rem;text-align:right;background:transparent;border:none;
    padding:.65rem .7rem;border-radius:var(--radius-sm);font-weight:600;font-size:.92rem;color:var(--ink);
  }
  nav.rail button:hover{background:var(--surface-2);}
  nav.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);}
  nav.rail button .badge-count{margin-inline-start:auto;background:var(--warm);color:var(--on-fill);font-size:.7rem;
    font-weight:700;border-radius:999px;padding:.05rem .45rem;}

  main{flex:1;min-width:0;padding:1.4rem 1.6rem 4rem;max-width:64rem;}
  .persona-strip{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;background:var(--info-soft);color:var(--info);
    border:1px solid var(--info);border-radius:var(--radius-sm);padding:.55rem .9rem;font-size:.85rem;font-weight:600;
    margin-bottom:1.1rem;}
  .persona-strip button{margin-inline-start:auto;background:var(--surface);border:1px solid var(--info);color:var(--info);
    border-radius:999px;padding:.35rem .8rem;font-weight:700;font-size:.78rem;}
  .persona-strip select{max-width:100%;min-width:0;}

  .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.1rem;flex-wrap:wrap;}
  .view-head p{margin:0;}
  .btn{
    display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;padding:.7rem 1.3rem;font-weight:700;
    font-size:.9rem;border:1px solid transparent;background:var(--accent);color:var(--on-fill);text-decoration:none;
  }
  .btn:hover{background:var(--accent-strong);}
  .btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);}
  .btn.secondary:hover{background:var(--surface-2);}
  .btn.ghost{background:transparent;color:var(--accent-strong);border-color:transparent;padding:.55rem .9rem;}
  .btn.danger{background:var(--critical);color:var(--on-fill);}
  .btn.warm{background:var(--warm);color:var(--on-fill);}
  .btn.sm{padding:.42rem .85rem;font-size:.8rem;border-radius:999px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn svg.ico{width:1.05em;height:1.05em;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(13rem,100%),1fr));gap:.9rem;margin-bottom:1.4rem;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.1rem 1.2rem;box-shadow:var(--shadow-1);}
  .card h2,.card h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;font-family:var(--font-body);
    color:var(--ink-muted);font-weight:700;margin-bottom:.5rem;}
  .card .stat{font-family:var(--font-mono);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
  .card .stat-sub{font-size:.78rem;color:var(--ink-muted);margin-top:.35rem;}
  .card.accent{border-color:var(--accent);}

  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.15rem 1.25rem;
    box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:.55rem;}
  .kpi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;}
  .kpi-top h2,.kpi-top h3{margin:0;font-size:.86rem;font-family:var(--font-body);font-weight:700;color:var(--ink);text-transform:none;
    letter-spacing:0;}
  .kpi-value{font-family:var(--font-mono);font-size:1.9rem;font-weight:600;}
  .kpi-target{font-size:.76rem;color:var(--ink-muted);}
  .track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .track > span{display:block;height:100%;background:var(--accent);border-radius:99px;}

  .pill{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .65rem;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap;}
  .pill.wait{background:var(--warning-soft);color:var(--warning);}
  .pill.signed{background:var(--info-soft);color:var(--info);}
  .pill.final{background:var(--success-soft);color:var(--success);}
  .pill.fix{background:var(--critical-soft);color:var(--critical);}
  .pill.phone{background:var(--warm-soft);color:var(--warm-ink);}
  .pill.draft{background:var(--surface-2);color:var(--ink-muted);}

  .callout{display:flex;gap:.7rem;background:var(--info-soft);border:1px solid var(--info);color:var(--ink);
    border-radius:var(--radius-sm);padding:.75rem .95rem;font-size:.86rem;margin-bottom:1rem;}
  .callout.warn{background:var(--warning-soft);border-color:var(--warning);}
  .callout.warm{background:var(--warm-soft);border-color:var(--warm);}
  .callout svg{flex:none;margin-top:.1rem;}
  .callout p{margin:0;color:var(--ink);}
  .callout strong{display:block;margin-bottom:.15rem;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);
    padding:1.3rem 1.4rem;margin-bottom:1.3rem;}
  .panel h2{font-size:1.15rem;margin-bottom:.9rem;}
  .field{margin-bottom:1rem;}
  .field label{display:block;font-weight:700;font-size:.85rem;margin-bottom:.35rem;}
  .hint{font-size:.76rem;color:var(--ink-muted);margin-top:.3rem;}
  .field input[type=text],.field input[type=password],.field input[type=date],.field input[type=tel],.field input[type=number],
  .field select,.field textarea{
    width:100%;padding:.65rem .8rem;border:1px solid var(--field-border);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--ink);font-size:.92rem;
  }
  .field input[type=email]{width:100%;padding:.65rem .8rem;border:1px solid var(--field-border);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font-size:.92rem;}
  .field textarea{min-height:5rem;resize:vertical;}
  .field.check{display:flex;align-items:flex-start;gap:.55rem;}
  .field.check input{margin-top:.25rem;width:1.15rem;height:1.15rem;flex:none;}
  .field.check label{font-weight:600;margin:0;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  @media(max-width:34rem){.row-2{grid-template-columns:1fr;}}

  .chip-list{display:flex;flex-wrap:wrap;gap:.45rem;margin:.5rem 0;}
  .chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface-2);border:1px solid var(--line);
    padding-block:.3rem;padding-inline-start:.75rem;padding-inline-end:.3rem;border-radius:999px;font-size:.82rem;font-weight:600;}
  .chip button{background:var(--surface);border:1px solid var(--line-strong);border-radius:50%;width:1.6rem;height:1.6rem;
    display:flex;align-items:center;justify-content:center;padding:0;}
  .chip button svg{width:.7rem;height:.7rem;}

  table{width:100%;border-collapse:collapse;font-size:.88rem;}
  .table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);}
  th,td{padding:.7rem .8rem;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  .inbox-card p,.callout p,.timeline li,.kosher-item,.modal-body{overflow-wrap:anywhere;}
  thead th{background:var(--surface-2);font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-muted);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.actions{white-space:nowrap;}
  td.actions .acts{display:flex;gap:.4rem;flex-wrap:wrap;}
  @media (max-width:40rem){
    .table-wrap.stack table,.table-wrap.stack tbody,.table-wrap.stack tr,.table-wrap.stack td{display:block;width:100%;}
    .table-wrap.stack thead{display:none;}
    .table-wrap.stack tr{border-bottom:1px solid var(--line);padding:.5rem 0;}
    .table-wrap.stack tbody tr:last-child{border-bottom:none;}
    .table-wrap.stack td{border-bottom:none;padding:.3rem .9rem;white-space:normal;}
    .table-wrap.stack td[data-label]::before{content:attr(data-label) ": ";font-weight:700;color:var(--ink-muted);font-size:.78rem;}
    .table-wrap.stack td.num{direction:rtl;text-align:right;}
  }

  .empty{padding:2.4rem 1rem;text-align:center;color:var(--ink-muted);}
  .empty svg{width:2.4rem;height:2.4rem;margin-bottom:.6rem;opacity:.6;}

  .inbox-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.1rem 1.2rem;
    box-shadow:var(--shadow-1);margin-bottom:.9rem;display:flex;flex-direction:column;gap:.5rem;}
  .inbox-card .top-row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;}
  .inbox-card h2,.inbox-card h3{margin:0;font-size:1.02rem;}

  .big-choice{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1.6rem 1.2rem;background:var(--surface);
    border:2px solid var(--line);border-radius:var(--radius-lg);text-align:center;width:100%;}
  .big-choice:hover{border-color:var(--accent);}
  .big-choice .brand-mark{width:3rem;height:3rem;font-size:1.3rem;}
  .welcome-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem;margin:1.4rem auto 0;max-width:66rem;align-items:stretch;}
  .app-shell[data-role="staff"] main{max-width:82rem;}
  .app-shell[data-role="staff"] .table-wrap td{white-space:normal;}
  .app-shell[data-role="staff"] .table-wrap .pill{white-space:normal;}
  @media (min-width:40.01rem){ .app-shell[data-role="staff"] .table-wrap table{min-width:56rem;} .app-shell[data-role="staff"] .table-wrap th,.app-shell[data-role="staff"] .table-wrap td .btn,.app-shell[data-role="staff"] .table-wrap td .badge,.app-shell[data-role="staff"] .table-wrap td .status{white-space:nowrap;} }
  .app-shell[data-role="welcome"] main{margin-inline:auto;width:100%;max-width:70rem;}
  .login-card{display:flex;flex-direction:column;margin:0;min-height:29.5rem;padding:1.5rem 1.4rem;}
  .login-card h2{justify-content:center;text-align:center;margin-bottom:.7rem;}
  .login-card > p:first-of-type{text-align:center;}
  .login-spacer{flex:1 1 auto;min-height:.4rem;}
  .login-card .btn{width:100%;justify-content:center;}
  .login-card .hint{text-align:center;}
  @media (max-width:60rem){ .welcome-grid{grid-template-columns:minmax(0,28rem);justify-content:center;} }

  .kosher-shell{max-width:30rem;margin:0 auto;text-align:center;}
  .kosher-shell .brand-mark{width:3.4rem;height:3.4rem;font-size:1.5rem;margin:0 auto 1rem;}
  .kosher-shell h1{font-size:1.5rem;}
  .kosher-item{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-lg);padding:1.3rem;
    margin:1.2rem 0;text-align:right;font-size:1.05rem;line-height:1.7;}
  .tel-btn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;padding:1.1rem;font-size:1.15rem;
    border-radius:var(--radius-lg);}

  .timeline{list-style:none;margin:0;padding:0;border-inline-start:2px solid var(--line);margin-inline-start:.5rem;}
  .timeline li{position:relative;padding:0 0 1.1rem 0;padding-inline-start:1.1rem;}
  .timeline li::before{content:"";position:absolute;inline-size:.65rem;block-size:.65rem;border-radius:50%;
    background:var(--accent);inset-inline-start:-.4rem;top:.3rem;}
  .timeline .ts{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-muted);}
  .timeline .what{font-weight:700;}
  .timeline .note{font-size:.85rem;color:var(--ink-muted);margin-top:.15rem;}

  dialog#modal{border:none;padding:0;border-radius:var(--radius-lg);box-shadow:var(--shadow-2);width:min(32rem,92vw);
    background:var(--surface);color:var(--ink);}
  dialog#modal::backdrop{background:rgba(10,16,14,.55);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.2rem;border-bottom:1px solid var(--line);}
  .modal-head h2{margin:0;font-size:1.1rem;}
  .modal-body{padding:1.2rem;max-height:65vh;overflow:auto;}
  .modal-foot{padding:1rem 1.2rem;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:.6rem;flex-wrap:wrap;}
  .x-btn{background:transparent;border:none;padding:.3rem;border-radius:50%;color:var(--ink-muted);}
  .x-btn:hover{background:var(--surface-2);}

  #a11y-pop{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-2);padding:1rem 1.1rem;
    width:min(15.5rem,calc(100vw - 2rem));max-height:calc(100vh - 5.5rem);overflow:auto;background:var(--surface);color:var(--ink);}
  #a11y-pop{position:fixed;inset:auto;top:4.5rem;left:1rem;margin:0;}
  #a11y-pop::backdrop{background:transparent;}
  #a11y-pop h2{font-size:.9rem;margin-bottom:.7rem;}
  .stepper{display:flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;margin-bottom:.9rem;}
  .stepper button{flex:1;background:var(--surface);border:none;padding:.45rem 0;font-weight:700;}
  .stepper button[aria-pressed="true"]{background:var(--accent);color:var(--on-fill);}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;font-size:.85rem;font-weight:600;}
  .switch{position:relative;width:2.6rem;height:1.5rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--field-border);flex:none;}
  .switch[aria-checked="true"]{background:var(--accent);}
  .switch span{position:absolute;top:1px;inset-inline-start:1px;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--surface);
    box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .15s;}
  .switch[aria-checked="true"] span{inset-inline-start:calc(100% - 1.3rem);}

  #toasts{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:.5rem;
    width:min(26rem,92vw);pointer-events:none;}
  dialog #toasts{top:1rem;bottom:auto;}
  .toast{background:var(--ink);color:var(--bg);padding:.75rem 1rem;border-radius:var(--radius-sm);box-shadow:var(--shadow-2);
    font-size:.86rem;font-weight:600;display:flex;gap:.5rem;align-items:flex-start;}
  .toast.success{background:var(--success);color:var(--on-fill);}
  .toast.warn{background:var(--warning);color:var(--on-fill);}
  .toast.err{background:var(--critical);color:var(--on-fill);}

  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;}
  .persona-label{flex:1 1 auto;min-width:0;}
  .table-search{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:0 0 .6rem;}
  .table-search .ts-box{position:relative;flex:1 1 16rem;max-width:24rem;}
  .table-search input{width:100%;padding:.55rem .85rem;padding-inline-start:2.3rem;border:1px solid var(--field-border);border-radius:999px;background:var(--surface);color:var(--ink);font-size:.9rem;}
  .table-search .ts-box svg{position:absolute;inset-inline-start:.8rem;top:50%;transform:translateY(-50%);color:var(--ink-muted);pointer-events:none;}
  .table-search .ts-count{font-size:.8rem;color:var(--ink-muted);}
  tr[hidden]{display:none!important;}
  tr.ts-empty td{text-align:center;color:var(--ink-muted);white-space:normal;padding:1.2rem .8rem;}
  .settings-group{border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1.1rem 1rem;margin:0 0 1rem;}
  .settings-group legend{font-weight:700;font-size:.9rem;padding:0 .4rem;}
  .radio-row{display:flex;flex-wrap:wrap;gap:.5rem;}
  .radio-row label{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--field-border);border-radius:999px;padding:.45rem .95rem;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--ink);}
  .radio-row input{accent-color:var(--accent);margin:0;}
  .radio-row label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);}
  .radio-row label:has(input:focus-visible){outline:3px solid var(--focus-ring);outline-offset:2px;}
  .modal-body h3{font-size:1rem;margin-top:1rem;}
  .modal-body ul{margin:.3rem 0 .8rem;padding-inline-start:1.2rem;color:var(--ink-muted);}
  .table-search .ts-filter{padding:.5rem .8rem;border:1px solid var(--field-border);border-radius:999px;background:var(--surface);color:var(--ink);font-size:.88rem;max-width:100%;}
  .th-sort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;}
  .th-sort:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px;}
  .th-sort .sort-ind{font-size:.7rem;opacity:.75;}
  .ts-pager{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin:.6rem 0 0;font-size:.82rem;color:var(--ink-muted);}
  .ts-pager[hidden]{display:none;}
  .card-search-empty{padding:1.2rem;text-align:center;color:var(--ink-muted);}
  .cal{max-width:23rem;margin:.2rem 0 1rem;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;}
  .cal-head strong{font-size:.95rem;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.28rem;}
  .cal-dn{font-size:.72rem;color:var(--ink-muted);text-align:center;font-weight:700;padding-bottom:.15rem;}
  .cal-day{min-height:2.4rem;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;font-weight:600;font-size:.88rem;font-family:var(--font-mono);}
  .cal-day.wkend{background:var(--surface-2);}
  .cal-day.sel{background:var(--accent);color:var(--on-fill);border-color:var(--accent);}
  .cal-day.done{text-decoration:line-through;}
  .cal-day:disabled{opacity:.45;cursor:not-allowed;}
  .cal-legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.76rem;color:var(--ink-muted);margin-top:.45rem;}
  .role-switch{border-style:dashed;align-items:center;}
  .role-switch .demo-tag{font-size:.68rem;font-weight:700;color:var(--ink-muted);padding:0 .55rem;letter-spacing:.02em;}
  .role-switch button{padding:.4rem .85rem;font-size:.8rem;}
  .more-menu{position:absolute;bottom:100%;inset-inline-end:.4rem;margin-bottom:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-2);padding:.35rem;display:flex;flex-direction:column;min-width:13rem;z-index:50;}
  .more-menu[hidden]{display:none!important;}
  .bottom-nav .more-menu button{flex-direction:row;justify-content:flex-start;gap:.6rem;font-size:.9rem;padding:.7rem .8rem;color:var(--ink);border-radius:var(--radius-sm);}
  .bottom-nav .more-menu button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);}
  .bottom-nav .more-menu .badge-count{position:static;margin-inline-start:auto;}
  .login-card h2{font-size:1.05rem;display:flex;align-items:center;gap:.5rem;}
  .sms-demo{background:var(--surface-2);border:1px dashed var(--field-border);border-radius:var(--radius-sm);padding:.6rem .8rem;font-size:.84rem;margin:0 0 .9rem;color:var(--ink);}
  .otp-input{font-family:var(--font-mono)!important;letter-spacing:.45em;text-align:center;font-size:1.25rem!important;direction:ltr;}
  .otp-links{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.3rem;margin-top:.5rem;}
  .form-err{color:var(--critical);background:var(--critical-soft);border:1px solid var(--critical);border-radius:var(--radius-sm);padding:.55rem .75rem;font-size:.85rem;font-weight:600;margin:0 0 .9rem;}
  .form-ok{color:var(--success);background:var(--success-soft);border:1px solid var(--success);border-radius:var(--radius-sm);padding:.55rem .75rem;font-size:.85rem;font-weight:600;margin:0 0 .9rem;}
  .pw-wrap{position:relative;}
  .field .pw-wrap input{padding-inline-end:4.8rem;}
  .pw-toggle{position:absolute;inset-inline-end:.3rem;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--accent-strong);font-weight:700;font-size:.8rem;padding:.35rem .5rem;border-radius:6px;}
  .linkish{background:none;border:none;padding:0;color:var(--accent-strong);font-weight:700;font-size:.82rem;text-decoration:underline;cursor:pointer;}
  .dchip{white-space:nowrap;display:inline-block;}
  .dsep{color:var(--ink-muted);font-weight:400;padding:0 .2rem;}
  .num{white-space:nowrap;}
  .table-wrap.stack td[data-label]::before{font-family:var(--font-body);letter-spacing:normal;}
  .gd-report{border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem;margin:0 0 .9rem;background:var(--surface);}
  .gd-report .top-row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem;}
  .gd-report h3{margin:0;font-size:.95rem;}
  .gd-report p{margin:0 0 .35rem;}
  .gd-report .timeline{margin-top:.6rem;}
  .dbl{font-family:var(--font-body);font-size:.78em;font-weight:700;color:var(--accent-strong);}
  .period-closed{display:flex;gap:.9rem;align-items:flex-start;background:var(--warning-soft);border:2px solid var(--warning);color:var(--ink);border-radius:var(--radius);padding:1.1rem 1.2rem;margin-bottom:1.1rem;}
  .period-closed svg{width:1.8rem;height:1.8rem;color:var(--warning);flex:none;}
  .period-closed strong{display:block;font-size:1.45rem;font-family:var(--font-display);color:var(--warning);margin-bottom:.2rem;}
  .period-closed p{margin:.15rem 0 0;color:var(--ink);}
  .chip .dbl-btn{width:auto;height:auto;min-height:1.9rem;border-radius:999px;padding:.15rem .65rem;font-size:.8rem;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.35rem;}
  .chip .dbl-btn .dbl-box{display:inline-grid;place-items:center;width:1rem;height:1rem;border:2px solid var(--line-strong);border-radius:4px;font-size:.7rem;line-height:1;}
  .chip .dbl-btn[aria-checked="true"]{background:var(--accent);color:var(--on-fill);border-color:var(--accent);}
  .chip .dbl-btn[aria-checked="true"] .dbl-box{border-color:var(--on-fill);}
  .cal-day{position:relative;}
  .cal-day .dbl-tag{position:absolute;top:-.45rem;inset-inline-start:-.35rem;background:var(--warning);color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;padding:0 .3rem;line-height:1.3;}
  .done-icon{width:4rem;height:4rem;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;margin:0 auto .6rem;}
  .done-icon svg{width:2rem;height:2rem;}
  .pick-list{border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem .7rem;margin:0 0 .9rem;}
  .pick-list legend{font-weight:700;font-size:.85rem;padding:0 .3rem;}
  .pick-opt{display:flex;align-items:center;gap:.55rem;padding:.4rem .2rem;cursor:pointer;min-height:2.4rem;}
  .pick-opt input{width:1.15rem;height:1.15rem;accent-color:var(--accent);}
  .eng-box{border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin:.2rem 0 1rem;background:var(--surface-2);}
  .eng-meta{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin-bottom:.6rem;font-size:.9rem;}
  .cap-row{display:grid;grid-template-columns:minmax(0,1fr);gap:.25rem;margin-top:.45rem;font-size:.88rem;}
  .cap-row .track span{display:block;height:100%;background:var(--accent);border-radius:99px;}
  .cap-row.warnc .track span{background:var(--warning);}
  .cap-row.fullc .track span{background:var(--danger, #b4372f);}
  .cal-day.rest::after{content:"";position:absolute;bottom:.2rem;left:50%;width:.35rem;height:.35rem;margin-left:-.175rem;border-radius:50%;background:var(--warning);}
  .reason-list{display:flex;flex-direction:column;gap:.15rem;}
  .reason-list label{display:flex;align-items:center;gap:.5rem;min-height:2.3rem;cursor:pointer;}
  .status-layout{display:grid;grid-template-columns:minmax(0,1fr) 13rem;gap:1rem;align-items:start;}
  .status-layout > *{min-width:0;}
  .status-nav{position:sticky;top:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.8rem;}
  .status-nav h2{font-size:.85rem;color:var(--ink-muted);margin:0 0 .5rem;}
  .status-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem;}
  .status-nav button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:.5rem;text-align:start;background:transparent;border:1px solid transparent;border-radius:10px;padding:.55rem .7rem;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;min-height:2.6rem;}
  .status-nav button:hover{background:var(--surface-2);}
  .status-nav button[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}
  .status-nav .sn-count{font-family:var(--font-mono, monospace);font-size:.8rem;background:var(--surface-2);border-radius:999px;padding:.05rem .5rem;}
  .status-nav .sn-first{border-color:var(--warning);}
  .scope-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;margin:0 0 .9rem;}
  .scope-toggle button{background:transparent;border:0;padding:.45rem 1rem;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;min-height:2.4rem;}
  .scope-toggle button[aria-pressed="true"]{background:var(--accent);color:var(--on-fill);}
  @media (max-width: 900px){
    .status-layout{grid-template-columns:minmax(0,1fr);}
    .status-nav{position:static;order:-1;padding:.6rem;}
    .status-nav ul{flex-direction:row;overflow-x:auto;padding-bottom:.2rem;}
    .status-nav li{flex:none;}
    .status-nav button{white-space:nowrap;}
  }
  @media print{ .status-nav, .scope-toggle{display:none !important;} .status-layout{display:block;} }
  .chip.is-dbl{border-color:var(--accent);background:var(--accent-soft);}
  .notes-list{list-style:none;margin:.4rem 0 0;padding:0;display:flex;flex-direction:column;gap:.5rem;}
  .notes-list li{background:var(--surface-2);border-radius:var(--radius-sm);padding:.55rem .75rem;font-size:.88rem;}
  .note-meta{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;font-size:.8rem;color:var(--ink-muted);margin-bottom:.15rem;}
  .note-meta .ts{font-family:var(--font-mono);}
  .month-filter{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;}
  .month-filter select{padding:.5rem .8rem;border:1px solid var(--field-border);border-radius:999px;background:var(--surface);color:var(--ink);font-size:.9rem;}
  .month-filter label{font-weight:700;font-size:.88rem;}
  .bottom-nav{display:none;}
  footer.legal{padding:1rem 1.6rem 2rem;color:var(--ink-muted);font-size:.76rem;text-align:center;}

  @media (max-width:56rem){
    nav.rail{display:none;}
    .bottom-nav{
      display:flex;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
      z-index:40;padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom));
    }
    .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;background:none;border:none;
      padding:.4rem 0;font-size:.66rem;font-weight:700;color:var(--ink-muted);position:relative;}
    .bottom-nav button[aria-current="page"]{color:var(--accent-strong);}
    .bottom-nav svg.ico{width:1.3em;height:1.3em;}
    .bottom-nav button span:not(.badge-count):not(.sr-only){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
    .bottom-nav button{min-width:0;}
    .bottom-nav .badge-count{position:absolute;top:0;inset-inline-end:.7rem;background:var(--warm);color:var(--on-fill);
      font-size:.62rem;border-radius:999px;padding:0 .3rem;}
    main{padding:1rem 1rem 1.5rem;}
    #toasts{bottom:calc(4.5rem + env(safe-area-inset-bottom));}
    dialog #toasts{top:1rem;bottom:auto;}
    html{scroll-padding-top:0;scroll-padding-bottom:calc(4.5rem + env(safe-area-inset-bottom));}
    .persona-strip button{flex-basis:100%;margin-inline-start:0;}
    .layout{flex-direction:column;}
    header.topbar{padding:.6rem .8rem;position:static;}
    .role-switch{order:3;width:100%;justify-content:space-between;}
    .role-switch button{flex:1;justify-content:center;}
  }

  /* ---------- שכבת עיצוב: גימור ברמת ממשקי הניהול של Apple, בצבעי הלוגו של אריאל ---------- */
  html{-webkit-text-size-adjust:100%;}
  body{font-size:1rem;line-height:1.47;letter-spacing:-.003em;font-feature-settings:"kern";text-rendering:optimizeLegibility;caret-color:var(--accent);}
  ::selection{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;}
  *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 22%,transparent) transparent;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 20%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}
  h1,h2,h3,h4{font-weight:600;letter-spacing:-.018em;}
  h1{font-size:1.75rem;line-height:1.18;}
  p{line-height:1.5;}
  a{color:var(--accent);text-underline-offset:.18em;text-decoration-thickness:1px;}
  .num{font-family:var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:0;}
  :focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--focus-ring);border-radius:8px;}
  .skip-link{border-radius:0 0 10px 10px;}

  /* כותרת עליונה: שכבה פונקציונלית צפה, שקיפות עדינה */
  header.topbar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--line-strong);box-shadow:none;padding:.55rem 1.4rem;min-height:3.6rem;}
  .brand{font-size:1.06rem;font-weight:600;letter-spacing:-.01em;gap:.75rem;}
  .brand small{text-transform:none;letter-spacing:0;font-size:.74rem;font-weight:500;}
  .brand-logo{background:transparent;box-shadow:none;padding:0;border-radius:0;height:2.15rem;}
  .welcome-logo{background:transparent;box-shadow:none;padding:0;height:4.6rem;margin-bottom:1.4rem;}
  .brand-logo,.welcome-logo{mix-blend-mode:multiply;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-logo, :root:not([data-theme="light"]) .welcome-logo{background:#fff;padding:.3rem .55rem;border-radius:9px;mix-blend-mode:normal;} }
  :root[data-theme="dark"] .brand-logo, :root[data-theme="dark"] .welcome-logo{background:#fff;padding:.3rem .55rem;border-radius:9px;mix-blend-mode:normal;}

  /* פקד מקטעים (segmented control) */
  .role-switch{background:color-mix(in srgb,var(--ink) 7%,transparent);border:0;border-radius:10px;padding:2px;gap:0;}
  .role-switch button{border-radius:8px;color:var(--ink);font-weight:500;font-size:.84rem;padding:.38rem .95rem;min-height:2rem;}
  .role-switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);}
  .role-switch .demo-tag{color:var(--ink-muted);font-weight:500;}
  .icon-btn{background:color-mix(in srgb,var(--ink) 7%,transparent);border:0;border-radius:10px;font-weight:500;padding:.45rem .8rem;min-height:2.25rem;}
  .icon-btn:hover{background:color-mix(in srgb,var(--ink) 11%,transparent);}
  svg.ico{stroke-width:1.65;}

  /* סרגל צד בסגנון sidebar */
  nav.rail{background:transparent;border-inline-end:.5px solid var(--line-strong);padding:1.2rem .7rem;gap:2px;width:15rem;top:3.6rem;max-height:calc(100vh - 3.6rem);}
  nav.rail .rail-label{text-transform:none;letter-spacing:0;font-size:.75rem;font-weight:600;padding:.2rem .75rem .45rem;}
  nav.rail button{border-radius:8px;font-weight:500;font-size:.9rem;padding:.5rem .75rem;min-height:2.35rem;gap:.6rem;}
  nav.rail button svg.ico{color:var(--accent);width:1.15em;height:1.15em;}
  nav.rail button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);}
  nav.rail button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent-strong);font-weight:600;}
  nav.rail button .badge-count{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font-weight:600;font-size:.72rem;padding:.05rem .5rem;font-variant-numeric:tabular-nums;}
  nav.rail button[aria-current="page"] .badge-count{background:var(--accent);color:var(--on-fill);}

  main{padding:1.8rem 2.2rem 4rem;margin-inline:auto;width:100%;}
  .panel .table-wrap{box-shadow:none;border:.5px solid var(--line-strong);border-radius:11px;}
  .persona-strip{background:var(--surface);color:var(--ink-muted);border:0;box-shadow:var(--shadow-1);border-radius:var(--radius);font-weight:500;padding:.5rem .6rem .5rem .9rem;}
  .persona-strip svg{color:var(--accent);}
  .persona-strip strong{color:var(--ink);}
  .persona-strip button{background:color-mix(in srgb,var(--accent) 10%,transparent);border:0;color:var(--accent);border-radius:8px;font-weight:600;padding:.35rem .8rem;}
  .persona-strip select{border:1px solid var(--field-border);border-radius:8px;padding:.3rem .5rem;background:var(--surface);}

  .view-head{margin-bottom:1.4rem;align-items:flex-end;}
  .view-head h1{margin-bottom:.25rem;}
  .view-head p{font-size:.95rem;}

  /* כפתורים */
  .btn{border-radius:10px;padding:.62rem 1.15rem;min-height:2.6rem;font-weight:600;font-size:.94rem;letter-spacing:-.005em;border:0;transition:background-color .15s ease,box-shadow .15s ease,transform .1s ease;}
  .btn:hover{background:var(--accent-strong);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border:0;}
  .btn.secondary:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);}
  .btn.ghost{background:transparent;color:var(--accent);padding:.5rem .7rem;}
  .btn.ghost:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);}
  .btn.danger{background:var(--critical);}
  .btn.danger:hover{background:color-mix(in srgb,var(--critical) 86%,#000);}
  .btn.warm{background:var(--warm);}
  .btn.warm:hover{background:color-mix(in srgb,var(--warm) 86%,#000);}
  .btn.sm{border-radius:8px;padding:.36rem .8rem;min-height:2rem;font-size:.84rem;}
  .btn[disabled]{opacity:.38;}

  /* כרטיסים ולוחות */
  .cards{gap:1rem;}
  .card{border:0;border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:1.1rem 1.25rem 1.15rem;}
  .card h2,.card h3{text-transform:none;letter-spacing:0;font-size:.84rem;font-weight:600;color:var(--ink-muted);margin-bottom:.45rem;}
  .card .stat{font-family:var(--font-display);font-size:2.1rem;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .card .stat-sub{font-size:.8rem;line-height:1.4;}
  .card.accent{box-shadow:var(--shadow-1),inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent);border:0;}
  .panel .card{box-shadow:none;background:var(--surface-2);}
  .panel .card.accent{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent);}
  .panel .card.accent h2,.panel .card.accent h3{color:var(--ink);}
  .kpi-card{border:0;box-shadow:var(--shadow-1);border-radius:var(--radius-lg);}
  .kpi-top h2,.kpi-top h3{font-weight:600;font-size:.9rem;}
  .kpi-value{font-family:var(--font-display);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .track{height:6px;background:color-mix(in srgb,var(--ink) 9%,transparent);}
  .panel{border:0;border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:1.35rem 1.5rem;margin-bottom:1.25rem;}
  .panel h2{font-size:1.12rem;font-weight:600;margin-bottom:.85rem;}
  .inbox-card{border:0;box-shadow:var(--shadow-1);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;}
  .inbox-card h2,.inbox-card h3{font-weight:600;}
  .gd-report{border:0;box-shadow:var(--shadow-1);border-radius:var(--radius);}

  /* תגיות סטטוס: מילוי עדין עם נקודת צבע */
  .pill{border-radius:7px;font-weight:600;font-size:.76rem;padding:.2rem .55rem;gap:.38rem;letter-spacing:0;}
  .pill::before{content:"";width:.42rem;height:.42rem;border-radius:50%;background:currentColor;flex:none;opacity:.9;}
  .pill.draft::before{opacity:.55;}
.pill.dot-only{padding:0;background:none;gap:0;}
.pill.dot-only::before{width:.55rem;height:.55rem;opacity:1;}

  /* הודעות */
  .callout{border:0;border-radius:var(--radius);padding:.8rem 1rem;font-size:.9rem;line-height:1.5;}
  .callout svg{color:var(--info);}
  .callout.warn svg{color:var(--warning);}
  .callout.warm svg{color:var(--warm-ink);}
  .callout strong{font-weight:600;}
  .period-closed{border:0;border-radius:var(--radius-lg);padding:1.15rem 1.3rem;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warning) 30%,transparent);}
  .period-closed strong{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;}
  .form-err,.form-ok{border:0;border-radius:10px;font-weight:500;}
  .sms-demo{border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface-2);}

  /* שדות */
  .field label{font-weight:600;font-size:.86rem;margin-bottom:.4rem;}
  .field input[type=text],.field input[type=password],.field input[type=date],.field input[type=tel],.field input[type=number],.field input[type=email],
  .field select,.field textarea{border-radius:10px;padding:.62rem .85rem;min-height:2.75rem;font-size:1rem;border:1px solid var(--field-border);
    background:var(--surface);transition:border-color .15s ease,box-shadow .15s ease;}
  .field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible,
  .table-search input:focus-visible,.table-search .ts-filter:focus-visible,.month-filter select:focus-visible{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);border-radius:10px;}
  .field textarea{min-height:5.5rem;}
  .hint{font-size:.8rem;line-height:1.4;}
  .settings-group{border:0;background:var(--surface-2);border-radius:var(--radius);padding:1rem 1.1rem 1.05rem;}
  .settings-group legend{float:right;width:100%;font-weight:600;font-size:.88rem;padding:0 0 .6rem;}
  .settings-group > legend ~ *,.pick-list > legend ~ *{clear:both;}
  .radio-row label{border-radius:9px;border:1px solid var(--field-border);background:var(--surface);font-weight:500;}
  .radio-row label:has(input:checked){background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:var(--accent);color:var(--accent-strong);font-weight:600;}
  .pick-list{border:0;background:var(--surface-2);border-radius:var(--radius);padding:.7rem .9rem .75rem;}
  .pick-list legend{float:right;width:100%;font-weight:600;padding:0 0 .3rem;}
  .switch{border:0;background:color-mix(in srgb,var(--ink) 16%,transparent);width:2.75rem;height:1.65rem;}
  .switch span{width:1.4rem;height:1.4rem;top:.125rem;inset-inline-start:.125rem;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);}
  .switch[aria-checked="true"]{background:var(--brand-green);}
  .switch[aria-checked="true"] span{inset-inline-start:calc(100% - 1.525rem);}
  .stepper{border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:10px;padding:2px;}
  .stepper button{background:transparent;border-radius:8px;font-weight:600;}
  .stepper button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.12);}

  /* טבלאות בסגנון רשימה */
  .table-wrap{border:0;border-radius:var(--radius-lg);box-shadow:var(--shadow-1);background:var(--surface);}
  table{font-size:.9rem;}
  th,td{padding:.72rem 1rem;border-bottom:.5px solid var(--line-strong);}
  thead th{background:var(--surface);text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:600;color:var(--ink-muted);padding-top:.8rem;padding-bottom:.6rem;}
  tbody tr{transition:background-color .12s ease;}
  tbody tr:hover{background:color-mix(in srgb,var(--accent) 4%,transparent);}
  .th-sort .sort-ind{opacity:.5;}
  .th-sort[aria-sort]:hover .sort-ind{opacity:1;}
  .table-search{margin-bottom:.75rem;}
  .table-search input{border-radius:10px;min-height:2.5rem;background:var(--surface);border:1px solid var(--field-border);}
  .table-search .ts-filter,.month-filter select{border-radius:10px;min-height:2.5rem;border:1px solid var(--field-border);}
  .month-filter label{font-weight:600;}
  .ts-pager .btn{min-height:2rem;}

  /* צ'יפים ולוח שנה */
  .chip{border:0;background:var(--surface-2);border-radius:9px;font-weight:600;padding-block:.28rem;}
  .chip button{border:0;background:color-mix(in srgb,var(--ink) 9%,transparent);}
  .chip.is-dbl{background:color-mix(in srgb,var(--accent) 10%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent);}
  .chip .dbl-btn{border:0;background:var(--surface);box-shadow:0 0 0 1px var(--field-border);}
  .chip .dbl-btn[aria-checked="true"]{box-shadow:none;}
  .cal{max-width:22rem;}
  .cal-head strong{font-size:1rem;font-weight:600;}
  .cal-grid{gap:.2rem;}
  .cal-dn{font-weight:600;font-size:.72rem;}
  .cal-day{font-family:var(--font-body);font-variant-numeric:tabular-nums;font-weight:500;font-size:.92rem;border:0;background:transparent;border-radius:50%;
    aspect-ratio:1;min-height:0;width:100%;max-width:2.75rem;justify-self:center;transition:background-color .12s ease;}
  .cal-day:not(:disabled):hover{background:color-mix(in srgb,var(--accent) 10%,transparent);}
  .cal-day.wkend{background:transparent;color:var(--ink-muted);}
  .cal-day.sel{background:var(--accent);color:var(--on-fill);font-weight:600;}
  .cal-day.sel:not(:disabled):hover{background:var(--accent-strong);}
  .cal-day:disabled{opacity:.3;}
  .cal-day.rest::after{bottom:.18rem;background:var(--brand-orange);}
  .cal-day .dbl-tag{background:var(--brand-orange);color:#1D1D1F;top:-.3rem;inset-inline-start:-.25rem;font-weight:700;}
  .eng-box{border:0;background:var(--surface-2);border-radius:var(--radius);padding:.9rem 1.05rem;}
  .cap-row.warnc .track span{background:var(--brand-yellow);}
  .cap-row.fullc .track span{background:var(--critical);}

  /* רשימות סטטוס ומתגים */
  .status-nav{border:0;box-shadow:var(--shadow-1);border-radius:var(--radius-lg);padding:.7rem;}
  .status-nav h2{font-size:.78rem;font-weight:600;padding:0 .35rem;}
  .status-nav button{border:0;border-radius:9px;font-weight:500;font-size:.9rem;min-height:2.5rem;}
  .status-nav button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);}
  .status-nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent-strong);font-weight:600;}
  .status-nav .sn-count{font-family:var(--font-body);font-variant-numeric:tabular-nums;font-weight:600;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);}
  .status-nav button[aria-current="page"] .sn-count{background:var(--accent);color:var(--on-fill);}
  .status-nav .sn-first{border:0;}
  .status-nav .sn-first:not([aria-current="page"]) .sn-count{background:var(--warning-soft);color:var(--warning);}
  .scope-toggle{border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:10px;padding:2px;}
  .scope-toggle button{border-radius:8px;font-weight:500;min-height:2.1rem;padding:.35rem 1rem;}
  .scope-toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12);}
  .notes-list li{border-radius:10px;}
  .timeline{border-inline-start:1.5px solid var(--line-strong);}
  .timeline li::before{width:.6rem;height:.6rem;box-shadow:0 0 0 3px var(--surface);}
  .timeline .ts{font-family:var(--font-body);font-variant-numeric:tabular-nums;}
  .timeline .what{font-weight:600;}
  .done-icon{background:color-mix(in srgb,var(--brand-green) 14%,transparent);color:var(--success);}

  /* חלונות קופצים והודעות צצות */
  dialog#modal{border-radius:16px;box-shadow:var(--shadow-2);width:min(34rem,92vw);}
  dialog#modal::backdrop{background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  dialog#modal[open]{animation:sheet-in .22s cubic-bezier(.2,.9,.3,1);}
  @keyframes sheet-in{from{opacity:0;transform:translateY(8px) scale(.985);}to{opacity:1;transform:none;}}
  .modal-head{border-bottom:0;padding:1.15rem 1.35rem .4rem;}
  .modal-head h2{font-size:1.15rem;font-weight:600;}
  .modal-body{padding:.6rem 1.35rem 1.1rem;}
  .modal-foot{border-top:.5px solid var(--line-strong);padding:.85rem 1.35rem;background:color-mix(in srgb,var(--surface-2) 55%,var(--surface));border-radius:0 0 16px 16px;}
  .x-btn{background:color-mix(in srgb,var(--ink) 7%,transparent);width:1.9rem;height:1.9rem;display:grid;place-items:center;}
  #a11y-pop{border:0;border-radius:var(--radius-lg);box-shadow:var(--shadow-2);}
  .toast{border-radius:12px;font-weight:500;background:color-mix(in srgb,var(--ink) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow-2);}
  .toast.success{background:var(--success);}
  .toast.warn{background:var(--warning);}
  .toast.err{background:var(--critical);}
  .more-menu{border:0;border-radius:var(--radius);box-shadow:var(--shadow-2);}

  /* מסך הכניסה */
  .app-shell[data-role="welcome"] main h1{font-size:2.5rem;letter-spacing:-.03em;font-weight:700;}
  .welcome-grid{gap:1.25rem;}
  .login-card{border-radius:18px;padding:1.6rem 1.5rem;box-shadow:var(--shadow-1);}
  .login-card h2{font-size:1.12rem;font-weight:600;}
  .login-card h2 svg{color:var(--accent);}
  .otp-input{font-family:var(--font-body)!important;font-variant-numeric:tabular-nums;font-weight:600;}
  .linkish{color:var(--accent);font-weight:600;text-decoration:none;}
  .linkish:hover{text-decoration:underline;}
  .kosher-item{border:0;box-shadow:var(--shadow-1);}

  footer.legal{font-size:.78rem;}
  @media (max-width:56rem){
    main{padding:1.1rem 1rem 1.6rem;}
    header.topbar{position:static;padding:.6rem .9rem;}
    .bottom-nav{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line-strong);}
    .bottom-nav button{font-size:.6875rem;font-weight:500;color:var(--ink-muted);}
    .bottom-nav button[aria-current="page"]{color:var(--accent);font-weight:600;}
    .bottom-nav .badge-count{background:var(--critical);color:var(--on-fill);}
    h1,.app-shell[data-role="welcome"] main h1{font-size:1.6rem;}
  }
  @media (prefers-reduced-motion: reduce){ dialog#modal[open]{animation:none;} }
  @media (prefers-reduced-transparency: reduce){
    header.topbar,.bottom-nav{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;}
    dialog#modal::backdrop{-webkit-backdrop-filter:none;backdrop-filter:none;}
  }
  [data-contrast="high"] header.topbar,[data-contrast="high"] .bottom-nav{-webkit-backdrop-filter:none;backdrop-filter:none;}
  [data-contrast="high"] .card,[data-contrast="high"] .panel,[data-contrast="high"] .table-wrap,[data-contrast="high"] .inbox-card,[data-contrast="high"] .login-card,[data-contrast="high"] .status-nav{box-shadow:0 0 0 1px #000;}
  @media print{
    header.topbar, nav.rail, .bottom-nav, footer.legal, .persona-strip, .table-search, .ts-pager, .no-print, .skip-link, #toasts{display:none!important;}
    body, .app-shell{background:#fff!important;color:#000!important;}
    main{max-width:none!important;padding:0!important;}
    .print-all tr[hidden]{display:table-row!important;}
    .table-wrap{overflow:visible!important;border:1px solid #999!important;}
    .card, .panel{box-shadow:none!important;border-color:#999!important;break-inside:avoid;}
    .table-wrap.stack table{display:table!important;} .table-wrap.stack thead{display:table-header-group!important;} .table-wrap.stack tr{display:table-row!important;} .table-wrap.stack td{display:table-cell!important;}
    .table-wrap.stack td[data-label]::before{content:none!important;}
    .print-all .table-wrap.stack td.no-print, .print-all .table-wrap th:last-child{display:none!important;}
    .sort-ind{display:none!important;}
    .print-only{display:block!important;}
  }
  .print-only{display:none;}
</style>

<div class="app-shell" dir="rtl" lang="he" id="appShell">
  <a class="skip-link" href="#main-content">דלג לתוכן הראשי</a>

  <header class="topbar">
    <button type="button" class="brand" data-action="go-login" aria-label="דיווח הגנים — יציאה למסך הכניסה" title="יציאה למסך הכניסה" style="background:transparent;border:none;padding:0;">
      <img class="brand-logo" data-logo alt="החברה העירונית אריאל">
      <span>דיווח הגנים<br><small>החברה העירונית אריאל · תל"ן</small></span>
    </button>
    <div class="topbar-spacer"></div>
    <div class="role-switch" role="group" aria-label="בחירת תפקיד">
      <button type="button" data-action="set-role" data-role="supplier">ספק</button>
      <button type="button" data-action="set-role" data-role="teacher">גננת</button>
      <button type="button" data-action="set-role" data-role="staff">רפרנטית</button>
    </div>
    <button type="button" class="icon-btn" data-action="open-a11y" popovertarget="a11y-pop" title="הגדרות נגישות">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><path d="M4 9c3.5 1.2 12.5 1.2 16 0M12 9v6m0 0-3 7m3-7 3 7"/></svg>
      <span>נגישות</span>
    </button>
  </header>

  <div popover id="a11y-pop" role="dialog" aria-labelledby="a11y-pop-title">
    <h2 id="a11y-pop-title">הגדרות נגישות</h2>
    <div class="field" style="margin-bottom:.9rem;">
      <span id="fs-label" style="display:block;font-weight:700;font-size:.85rem;margin-bottom:.35rem;">גודל טקסט</span>
      <div class="stepper" role="group" aria-labelledby="fs-label">
        <button type="button" data-action="font-scale" data-scale="1">רגיל</button>
        <button type="button" data-action="font-scale" data-scale="1.15">גדול</button>
        <button type="button" data-action="font-scale" data-scale="1.3">גדול מאוד</button>
      </div>
    </div>
    <div class="switch-row">
      <span id="contrast-label">ניגודיות גבוהה</span>
      <button type="button" class="switch" role="switch" aria-checked="false" aria-labelledby="contrast-label"
        data-action="toggle-contrast"><span></span></button>
    </div>
    <button type="button" class="btn ghost sm" data-action="open-a11y-statement" style="margin-top:.8rem;padding-inline:0;">הצהרת נגישות</button>
  </div>

  <div class="layout">
    <nav class="rail" id="railNav" aria-label="ניווט ראשי"></nav>
    <main id="main-content" tabindex="-1"></main>
  </div>

  <footer class="legal">
    החברה העירונית אריאל · מערכת דיווח הגנים
    <button type="button" class="btn ghost sm" data-action="open-a11y-statement">הצהרת נגישות</button>
  </footer>

  <nav class="bottom-nav" id="bottomNav" aria-label="ניווט ראשי (נייד)"></nav>
</div>

<dialog id="modal" aria-labelledby="modal-title" lang="he" dir="rtl">
  <div class="modal-head">
    <h2 id="modal-title"></h2>
    <button type="button" class="x-btn" data-action="close-modal" aria-label="סגירה">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="modal-body" id="modal-body" tabindex="0" role="region" aria-labelledby="modal-title"></div>
  <div class="modal-foot" id="modal-foot"></div>
</dialog>

<div id="toasts" role="status" aria-live="polite" lang="he" dir="rtl"></div>

<script src="app.js"></script>




</body>
</html>
