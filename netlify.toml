# Static site, no build step. Netlify serves index.html from the repo root.
[build]
  publish = "."
  command = ""

# Security headers (OWASP A02:2025 Security Misconfiguration).
# The app script lives in app.js so the CSP can allow scripts from 'self' only, with no 'unsafe-inline'.
# Inline style attributes are used throughout the UI, so style-src keeps 'unsafe-inline' (low risk without script execution).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
